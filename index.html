<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BreadLifeMod 2.0.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0d0f;
      --surface:   #16181c;
      --border:    #2a2d35;
      --accent:    #f5c542;
      --accent2:   #e8813a;
      --text:      #d4cfc4;
      --muted:     #5a5a6a;
      --pixel:     2px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'VT323', monospace;
      overflow: hidden;
    }

    /* pixel grid bg */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(245,197,66,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245,197,66,.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    .scene {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    /* floating pixel particles */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: var(--accent);
      opacity: 0;
      animation: float-up linear infinite;
    }
    @keyframes float-up {
      0%   { transform: translateY(0) rotate(0deg);   opacity: 0; }
      10%  { opacity: .6; }
      90%  { opacity: .3; }
      100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
    }

    /* card */
    .card {
      background: var(--surface);
      border: var(--pixel) solid var(--border);
      box-shadow:
        4px 4px 0 #000,
        inset 0 0 60px rgba(245,197,66,.04);
      padding: 48px 56px 52px;
      width: min(480px, 92vw);
      text-align: center;
      image-rendering: pixelated;
    }

    /* bread icon */
    .icon-wrap {
      margin-bottom: 28px;
    }
    .bread-icon {
      display: inline-block;
      position: relative;
      animation: bob 3s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }
    .bread-icon svg {
      width: 64px;
      height: 64px;
      image-rendering: pixelated;
    }

    /* title */
    .title {
      font-family: 'Press Start 2P', monospace;
      font-size: 15px;
      color: var(--accent);
      text-shadow: 2px 2px 0 #000, 0 0 20px rgba(245,197,66,.4);
      line-height: 1.6;
      letter-spacing: .5px;
      margin-bottom: 6px;
    }
    .version {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      color: var(--accent2);
      letter-spacing: 2px;
      margin-bottom: 28px;
    }

    /* divider */
    .divider {
      border: none;
      border-top: var(--pixel) solid var(--border);
      margin: 0 0 28px;
    }

    /* meta */
    .meta {
      font-size: 18px;
      color: var(--muted);
      letter-spacing: 1px;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .meta span {
      color: var(--text);
    }

    /* button */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: #111;
      background: var(--accent);
      border: none;
      padding: 14px 28px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 4px 4px 0 #000;
      transition: transform .08s, box-shadow .08s;
      letter-spacing: .5px;
      position: relative;
      overflow: hidden;
    }
    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.18) 0%, transparent 60%);
    }
    .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #000;
      background: #fdd35a;
    }
    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #000;
    }
    .btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    /* click flash */
    .flash {
      position: fixed;
      inset: 0;
      background: rgba(245,197,66,.12);
      pointer-events: none;
      opacity: 0;
      z-index: 99;
      transition: opacity .3s;
    }
    .flash.show { opacity: 1; transition: none; }

    /* footer */
    .footer {
      margin-top: 32px;
      font-size: 15px;
      color: var(--muted);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<div class="particles" id="particles"></div>
<div class="flash" id="flash"></div>

<div class="scene">
  <div class="card">

    <div class="icon-wrap">
      <div class="bread-icon">
        <!-- pixel bread SVG -->
        <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="6" width="14" height="8" fill="#c8732a"/>
          <rect x="2" y="5" width="12" height="2" fill="#e8913a"/>
          <rect x="3" y="3" width="10" height="3" fill="#f5c04a"/>
          <rect x="4" y="2" width="8"  height="2" fill="#fdd96a"/>
          <rect x="5" y="1" width="6"  height="2" fill="#ffe78a"/>
          <rect x="2" y="7" width="12" height="1" fill="#a85c1e" opacity=".5"/>
          <rect x="4" y="9" width="2"  height="2" fill="#fdd96a" opacity=".35"/>
          <rect x="8" y="10" width="3" height="2" fill="#fdd96a" opacity=".35"/>
        </svg>
      </div>
    </div>

    <div class="title">BreadLifeMod</div>
    <div class="version">v2.0.0</div>
    <hr class="divider"/>

    <div class="meta">
      Platform: <span>PaperSpigot 1.21.1</span><br/>
      File: <span>BreadLifeMod-2_0_0.jar</span>
    </div>

    <a class="btn" href="BreadLifeMod-2_0_0.jar" download id="dlBtn">
      <svg viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 12l-5-5h3V2h4v5h3L8 12z"/>
        <rect x="2" y="13" width="12" height="2"/>
      </svg>
      CLICK TO DOWNLOAD
    </a>

    <div class="footer">[ PaperSpigot · Java Edition ]</div>
  </div>
</div>

<script>
  // particles
  const container = document.getElementById('particles');
  const colors = ['#f5c542','#e8813a','#fdd96a','#c8732a'];
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.bottom = '-10px';
    p.style.background = colors[i % colors.length];
    p.style.width = p.style.height = (4 + Math.random() * 6) + 'px';
    p.style.animationDuration = (8 + Math.random() * 14) + 's';
    p.style.animationDelay = (Math.random() * 12) + 's';
    container.appendChild(p);
  }

  // flash on download
  document.getElementById('dlBtn').addEventListener('click', () => {
    const f = document.getElementById('flash');
    f.classList.add('show');
    setTimeout(() => f.classList.remove('show'), 80);
  });
</script>
</body>
</html>
